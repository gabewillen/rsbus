[project]
name = "rsbus"
version = "0.1.0"
description = "Lennox RSBus (Residential Serial Bus) protocol implementation — hierarchical state machine models of the Lennox distributed-architecture HVAC communication network"
readme = "README.md"
authors = [
    { name = "gabewillen", email = "gabewillen@gmail.com" }
]
keywords = ["hvac", "can-bus", "rsbus", "lennox", "state-machine", "hsm", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
]
requires-python = ">=3.13"

[project.license]
file = "LICENSE"
dependencies = [
    "stateforward-hsm>=1.3.1",
    "python-can>=4.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[project.scripts]
rsbus = "rsbus:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
